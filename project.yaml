manifest_version: 2
id: 28
name: kafka-streams-demo
program:
  id: mlops-data-platform
  narrative_fit: "Proves the streaming stage that turns business events into enriched and aggregated data products."
  shared_assets:
    - benchmark-result-v2 contract
    - deterministic event fixtures
    - Kafka Streams decision profile
status: benchmarked
claim: "Processes purchases through a stateful stream-table join and customer aggregation with reproducible broker-backed evidence."
stack:
  - kotlin
  - java21
  - gradle-kotlin-dsl
  - kafka-streams
  - kafka
  - testcontainers
  - docker
language_profile:
  primary: kotlin-jvm
  secondary: []
  reason: "Kotlin provides concise immutable domain contracts and Java interoperability without adding a Spring runtime that the streaming claim does not need."
jvm:
  language: kotlin
  framework: none
  build: gradle-kotlin-dsl
  toolchain_version: 21
  gradle_wrapper_version: "9.3.0"
  wrapper_distribution_sha256: "0d585f69da091fc5b2beced877feab55a3064d43b8a1d46aeb07996b0915e0e0"
  interoperability_boundary: "Domain records remain free of serialization, Kafka, Docker, and framework imports; infrastructure owns wire DTO mapping."
  benchmark_effect: "The JVM, dependency lock, container images, and fixture seed are fixed in every evidence record."
  rejected_alternatives:
    - option: java-spring
      reason: "No HTTP, dependency injection, persistence, or web lifecycle is part of the measured behavior."
    - option: scala
      reason: "It would add a second JVM language without improving the Kafka Streams proof or portfolio interoperability."
messaging_decision:
  selected_messaging_mode: kafka
  reason: "The problem requires replayable partitioned logs, stream-table joins, materialized state, and restoration semantics."
  delivery_guarantee: exactly-once-v2 for the broker-backed runtime
  ordering_need: "Per-customer ordering through customerId keys and three partitions."
  replay_need: "Required for rebuilding profile and aggregate state from compacted/changelog topics."
  retry_dlq_strategy: "Kafka client retries are bounded by client configuration; malformed records fail fast because no product requirement justifies a silent DLQ."
  rejected_alternatives:
    - option: rabbitmq
      reason: "Queue routing and acknowledgements do not provide the required KTable join and local state-store model."
    - option: synchronous-http
      reason: "Request-response coupling removes replay and partitioned state restoration from the proof."
  kafka_streams:
    processing_mode: kafka-streams
    key_strategy: customerId
    repartition_strategy: "Purchases keep customerId as the key; enriched records are re-keyed before the customer aggregate."
    serde_contract: "Versioned JSON wire DTOs map to framework-free domain records at the infrastructure boundary."
    topology: "purchases joins customer-profiles, emits enriched-purchases, and aggregates customer-summaries."
    state_stores:
      - customer-profile-store
      - customer-summary-store
    processing_guarantee: exactly_once_v2
    invalid_record_strategy: "Fail fast and expose the error; quarantine is intentionally out of scope."
    restoration_strategy: "Broker mode restores named state stores from compacted source and changelog topics."
    benchmark_modes:
      - topology-test-driver
      - real-broker
    input_topics:
      - purchases
      - customer-profiles
    output_topics:
      - enriched-purchases
      - customer-summaries
    stream_table_join_semantics: "Each purchase joins the latest compacted customer profile for the same customerId."
    window_and_grace_policy: "No event-time window is used, so grace is not applicable."
    changelog_policy: "Named persistent stores use Kafka Streams changelogs in broker mode."
    rebalance_plan: "Integration tests cover broker startup and end-to-end state; multi-instance reassignment remains a documented production extension."
    evidence_plan: "Keep deterministic topology evidence separate from three-partition real-broker end-to-end evidence."
decision_brain:
  principles:
    coupling_rule: "Domain records and policies do not import Kafka, cloud SDKs, transport, Docker, or frameworks."
    solid:
      - srp
      - ocp
      - lsp
      - isp
      - dip
    simplicity_rule: "KISS and YAGNI: use one topology process, no Spring, database, HTTP API, schema registry, or cloud service without a requirement."
    testability_rule: "Pure domain rules and TopologyTestDriver tests run before broker-backed integration."
    rejected_overengineering:
      - microservices
      - spring-boot
      - database
      - schema-registry
      - cloud-sdk
  stack_profile: kafka-streams
  api_style: cli
  messaging: kafka
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: "Kumo is not started because this repository claims no cloud behavior; a future cloud use case must enter through an outbound port."
    config_switch: none
    unsupported_behaviors: []
  database: none
  runtime: "JVM 21 in a non-root, read-only Docker runtime with an official Kafka 4.3.1 broker."
  library_policy: "Dependencies must expose measured streaming behavior, be locked by Gradle, and have compatible licenses."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: graphql-or-rest
      reason: "There is no client query or request-response use case."
architecture:
  style: event-driven
  reason: "Stateful asynchronous event processing is the behavior under test, not an integration detail."
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: medium
    throughput_or_async: high
    independent_deployability: low
  dependency_rule: "Infrastructure composes inward-facing domain contracts; domain code has no Kafka or runtime dependency."
  boundaries:
    - "domain: immutable events and enrichment/aggregation policies"
    - "infra: Serdes, topology composition, stores, and Kafka runtime properties"
    - "benchmark: deterministic fixtures, real-broker harness, metrics, and provenance"
    - "entrypoint: CLI mode selection only"
  rejected_alternatives:
    - style: microservices
      reason: "One topology has no independent deployment boundaries worth the distributed coordination cost."
    - style: mvc
      reason: "There is no interactive request/view lifecycle."
    - style: full-hexagonal-ports
      reason: "Kafka Streams is the measured application boundary; wrapping every DSL type would obscure the topology without reducing coupling."
design_system:
  tokens: .portfolio/design-system/generated/tokens.css
  readme_components:
    - numbered-sections
    - benchmark-evidence-table
    - architecture-diagram
  diagram_required: true
reuse:
  manifest: reuse.manifest.yaml
  kit_version: "1.2.0"
  contribution_review: sdd/reuse-improvement-review.md
benchmark:
  primary_metric: end_to_end_input_records_per_second
  unit: records/s
  command: "pwsh -File tools/run-broker-benchmark.ps1 -Records 1000 -Warmups 1 -Repeats 5 -OutputPath benchmarks/results/baseline.json"
  result_path: benchmarks/results/baseline.json
  evidence_status: current
release:
  docker: "docker build -t kafka-streams-demo:local . && docker run --rm kafka-streams-demo:local demo"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
