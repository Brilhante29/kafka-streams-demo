name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: gradle:8.10.2-jdk21
    steps:
      - uses: actions/checkout@v4
      - name: Run tests and lint
        run: gradle --no-daemon clean check
      - name: Run fixed-batch benchmark
        run: gradle --no-daemon run --args="benchmark 100000 benchmarks/results/ci.json"
      - name: Validate benchmark JSON
        run: python -m json.tool benchmarks/results/ci.json >/dev/null

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kafka-streams-demo:ci
