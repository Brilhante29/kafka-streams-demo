name: ci

on:
  push:
    branches: [main, master, "codex/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: gradle:8.10.2-jdk21
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run tests and lint
        run: gradle --no-daemon clean check
      - name: Run fixed-batch benchmark
        run: gradle --no-daemon run --args="benchmark 100000 benchmarks/results/ci.json"
      - name: Validate benchmark JSON
        run: python -m json.tool benchmarks/results/ci.json >/dev/null

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.13.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.20.0
        with:
          context: .
          push: false
          tags: kafka-streams-demo:ci
