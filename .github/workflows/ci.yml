name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  quality:
    name: JVM, contracts, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate and cache Gradle Wrapper
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Unit, topology, lint, and broker integration tests
        run: ./gradlew --no-daemon clean check integrationTest

      - name: Generate topology-driver CI evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          EVIDENCE_CLEAN_TREE: "true"
          EVIDENCE_PRODUCER: github-actions
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HARDWARE_CLASS: github-ubuntu-24.04
        run: >-
          ./gradlew --no-daemon run
          --args="topology-benchmark 30 1 2 benchmarks/results/topology-ci.json"

      - name: Validate topology evidence semantics
        shell: pwsh
        run: >-
          ./tools/validate-benchmark-result.ps1
          -Path benchmarks/results/topology-ci.json
          -ExpectedBenchmarkId topology-test-driver

      - name: Validate repository contracts
        shell: pwsh
        run: |
          ./tools/validate-gradle-project.ps1 -SkipBuild
          ./tools/validate-project.ps1 -SkipDocker
          ./tools/validate-benchmark-result.ps1 -Path benchmarks/results/baseline.json -ExpectedBenchmarkId real-broker-end-to-end -RequireClean

      - name: Fallback secret scan
        shell: pwsh
        run: ./tools/scan-secrets.ps1

  broker-security:
    name: Broker smoke, image security, and SBOM
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Real Kafka end-to-end smoke
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
          HARDWARE_CLASS: github-ubuntu-24.04
        run: >-
          ./tools/run-broker-benchmark.ps1
          -Records 100
          -Warmups 1
          -Repeats 2
          -OutputPath benchmarks/results/broker-ci.json

      - name: Validate broker evidence
        shell: pwsh
        run: >-
          ./tools/validate-benchmark-result.ps1
          -Path benchmarks/results/broker-ci.json
          -ExpectedBenchmarkId real-broker-end-to-end
          -RequireClean

      - name: Verify non-root runtime
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint id kafka-streams-demo:local -u)" = "10001"
          docker run --rm kafka-streams-demo:local demo

      - name: Scan repository dependencies, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Scan application image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: kafka-streams-demo:local
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: kafka-streams-demo:local
          format: spdx-json
          output: sbom.spdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kafka-streams-demo-sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
