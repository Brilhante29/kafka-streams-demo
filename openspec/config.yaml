schema: portfolio-system
project:
  id: 28
  name: kafka-streams-demo
references:
  - portfolio-reuse-kit@1.2.0
context: |
  Source of truth order: project.yaml, sdd/, openspec/artifacts/, implementation, benchmark evidence.
  Prove a stateful stream-table join and aggregation with separate topology-driver and real-broker evidence.
  Keep domain policy independent from Kafka/runtime and keep the default path local-first with no paid secret.
rules:
  specification:
    - Every requirement maps to implementation, test, and evidence.
    - Architecture and stack decisions must include rejected alternatives.
  benchmark:
    - Never describe TopologyTestDriver as broker throughput.
    - Release evidence requires a clean source tree and benchmark-result-v2 provenance.
  reuse:
    - Consume portfolio-reuse-kit before creating a local equivalent.
    - Contribute back only generic, tested behavior useful to another repository.
  delivery:
    - Finish this repository before opening another portfolio project.
    - Do not merge without explicit authorization.
